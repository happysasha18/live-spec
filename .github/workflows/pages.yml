# pages.yml — the work board's one stable link (SPEC spec/work-board.md Requirement 309
# criterion 8, INV-308/INV-67).
#
# The board is ONE source file in this tree — scripts/render-board.sh — and this workflow is only
# how its rendered page reaches a link. It runs the repository's own renderer against the
# repository's own checkout and publishes the single file that renderer wrote. There is no second
# board store, no committed board.html (the root .gitignore keeps every *.html out of git), and no
# hand upload: change PLAN.md, a checkpoint or WAITING.md, push, and the page at the canonical link
# is drawn again from what the tree now says.
#
# Canonical link: https://happysasha18.github.io/live-spec/board.html
#
# The uploaded directory holds board.html and nothing else. Pages serves a file path directly, so
# no index.html is added — the canonical link names the file, and inventing an index would be a
# second page nobody registered.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:        # a hand-run, for redrawing the page without a push

# One deploy at a time, and a newer push wins: a queued older render would publish a board that is
# already behind the tree it claims to show.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # the renderer reads git — HEAD's subject, the lane branches, the worktrees
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "render the board from this tree (scripts/render-board.sh, stdlib only)"
        run: |
          mkdir -p _site
          bash scripts/render-board.sh _site/board.html
          # the uploaded directory holds the one rendered file and nothing else
          test "$(ls -A _site)" = "board.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
