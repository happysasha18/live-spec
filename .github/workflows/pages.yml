# pages.yml — the work board's one stable link (SPEC spec/work-board.md Requirement 309
# criterion 8, INV-308/INV-67).
#
# The board is ONE source file in this tree — scripts/render-board.sh — and this workflow is only
# how its rendered page reaches a link. It runs the repository's own renderer against the
# repository's own checkout and publishes the single file that renderer wrote. There is no second
# board store, no committed board.html (the root .gitignore keeps every *.html out of git), and no
# hand upload: change PLAN.md, a checkpoint or WAITING.md, push, and the page at the canonical link
# is drawn again from what the tree now says.
#
# Canonical link: https://happysasha18.github.io/live-spec/board.html
#
# The uploaded directory holds board.html and nothing else. Pages serves a file path directly, so
# no index.html is added — the canonical link names the file, and inventing an index would be a
# second page nobody registered.
#
# WHAT HAS TO BE TRUE BEFORE A DONE ROW IS PUBLISHED. This workflow does not run on a push. It
# runs after the `gates` workflow finishes for a commit, and only where that run SUCCEEDED —
# `gates` is where every done row's own acceptance command is re-run at that commit (gate v), and
# where a done row standing on no passed receipt is refused (gate u). A board published before
# those ran would be publishing a done whose only evidence is text somebody wrote into a
# checkpoint. When gates reds, nothing is published and the previous page stays up: a stale board
# is a smaller lie than a confident one (the owner's word, 2026-09-07).
name: pages
on:
  workflow_run:
    workflows: [gates]
    types: [completed]
    branches: [main]
# `workflow_dispatch` left this workflow on 2026-09-07. A hand-run carried no gates verdict to
# read and published whatever `github.ref` pointed at, so anyone who could type a receipt could
# also type `gh workflow run pages.yml` and publish it — the one door around the rule above.
# Redrawing the page is a push.

# One deploy at a time, and a newer push wins: a queued older render would publish a board that is
# already behind the tree it claims to show.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Three conditions, and all three are needed. The gates run must have SUCCEEDED, because that
    # is where every done row's own acceptance was executed. It must have been a PUSH: `gates`
    # also runs on pull_request, and `workflow_run.branches` filters on the triggering run's own
    # head_branch, so a fork's pull request from a branch named `main` would otherwise publish the
    # fork's board — with the fork's own check table deciding what green means. And it must have
    # come from THIS repository, for the same reason one step further out.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit gates actually judged, never whatever main points at now: a later push
          # would otherwise be published under an earlier push's green verdict.
          ref: ${{ github.event.workflow_run.head_sha }}
          # The renderer reads git for HEAD's subject and the lane branches, and — in
          # records-only mode — for every time on the page: a checkout's own file stamps are all
          # the checkout instant, so the commit history is the only record of when a row opened.
          # Shallow this and every row reads "opened: not recorded".
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "render the board from this tree (scripts/render-board.sh, stdlib only)"
        # The rows are drawn as PLAN.md records them (criterion 22). This runner carries neither
        # the installed pack nor the suite's dependencies, so re-running each row's acceptance
        # command here would publish landed work as reopened — a verdict about this machine
        # dressed as a verdict about the work. The re-run that DOES decide happens one workflow
        # earlier, in gates (gate v), where a key that fails stops the publish instead of
        # repainting a row.
        env:
          LIVE_SPEC_BOARD_CHECKS: "off"
        run: |
          mkdir -p _site
          bash scripts/render-board.sh _site/board.html
          # the uploaded directory holds the one rendered file and nothing else
          test "$(ls -A _site)" = "board.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
