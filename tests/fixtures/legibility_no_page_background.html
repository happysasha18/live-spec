<!doctype html><html><head><style>
body { color: #767676; font-size: 16px; }
code { background: rgba(127,127,127,.14); }
pre { background: rgba(127,127,127,.10); }
th { background: rgba(127,127,127,.12); }
</style></head><body>
<p>The page declares no background of its own. The three rules that do paint are translucent,
so their colour depends on whatever renders beneath them.</p>
</body></html>
