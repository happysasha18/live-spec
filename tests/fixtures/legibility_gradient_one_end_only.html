<!-- The same shape with the stops disagreeing: the text clears the floor at one end of the run and
     fails at the other. No static read decides that pair, so it goes to the eye. -->
<html><head><style>
body { background: linear-gradient(#ffffff, #111827); }
.over-gradient { color: #666666; font-size: 16px; }
</style></head>
<body><span class="over-gradient">Text over the gradient</span></body></html>
