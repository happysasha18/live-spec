<!-- Text over a gradient every stop of which leaves it under the floor. Nothing but a render says
     where on the run the text sits, and here nothing needs to: it fails at both ends, so the file
     decides the pair on its own. Standing down on this lost a red the reader used to print. -->
<html><head><style>
body { background: linear-gradient(#111827, #2a2f3a); }
.over-gradient { color: #4d5156; font-size: 16px; }
</style></head>
<body><span class="over-gradient">Text over the gradient</span></body></html>
